name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --all-targets --locked

  # The fuzz targets (fuzz/, a workspace of its own): every one builds on each
  # push, so they keep compiling as the core moves, and each runs for 60 s with
  # debug assertions. The nightly is pinned by date so a red run reproduces; a
  # crash's input is printed in the log (libFuzzer's "Base64:" line).
  fuzz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: nightly-2026-11-07
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      # cargo fuzz has no --locked: fetch with it, then check the build left the lock alone.
      - run: cargo fetch --locked
      - run: cargo fuzz build -a
      - run: git diff --exit-code Cargo.lock
      - name: Run each target for 60 s
        run: |
          targets=$(cargo fuzz list)
          test -n "$targets" || { echo "no fuzz targets found"; exit 1; }
          for t in $targets; do
            mkdir -p "corpus/$t"
            dirs="corpus/$t"
            if [ -d "seeds/$t" ]; then dirs="$dirs seeds/$t"; fi
            echo "::group::$t"
            cargo fuzz run -a "$t" $dirs -- -max_total_time=60 -timeout=5 -rss_limit_mb=1024
            echo "::endgroup::"
          done

  # The Android app (ADR-0004 section 9): the Gradle wrapper's checksum, the
  # core for aarch64-linux-android with the runner's NDK, the APK and its JVM
  # unit tests; then the APK's libraries (the Kotlin standard library and its
  # annotations only), its packaged manifest, and the 16 KB alignment of the
  # core inside it.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - run: android/build-core.sh
      - run: ./gradlew --no-daemon assembleDebug testDebugUnitTest checkPackagedLibraries
        working-directory: android
      - run: python3 -I android/check_manifest.py android/app/build/intermediates/packaged_manifests/debug/processDebugManifestForPackage/AndroidManifest.xml
      - name: The core is aligned for 16 KB pages
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libsensio.so' || { echo "the core isn't in the APK"; exit 1; }
          zipalign="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -1)zipalign"
          "$zipalign" -c -P 16 4 "$apk"

  # The GPL boundary (ADR-0001 section 2) and RustSec, per deny.toml. Advisories
  # run apart: a new advisory can turn CI red with no change here, and the job
  # name then says so.
  deny:
    name: deny (${{ matrix.checks }})
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked
          command: check ${{ matrix.checks }}
