[workspace]
resolver = "3"
members = ["crates/sensio-core", "crates/sensio-sources", "crates/sensio-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ygcxo/peil-rf"
publish = false

[workspace.dependencies]
sensio-core = { path = "crates/sensio-core" }
sensio-sources = { path = "crates/sensio-sources" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
insta = { version = "1", features = ["json"] }
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
